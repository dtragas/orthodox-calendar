<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Get Orthodox Calendar — Saints &amp; Name Days</title>
<meta name="description" content="Daily Orthodox saints, feast days and name-day reminders. Free, ad-free, private. Download for iPhone or Android.">
<!-- Link preview (WhatsApp / iMessage / Facebook) -->
<meta property="og:title" content="Orthodox Calendar — Saints &amp; Name Days">
<meta property="og:description" content="See today's saints and never miss a loved one's name day. Free &amp; ad-free.">
<meta property="og:image" content="https://dtragas.github.io/orthodox-calendar/icon.png">
<meta property="og:url" content="https://dtragas.github.io/orthodox-calendar/get/">
<meta property="og:type" content="website">
<link rel="icon" href="../icon.png">
<style>
  :root { --indigo:#1A237E; --gold:#C8A84C; --ivory:#FDF6E3; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,serif; background:var(--ivory); color:#1b1b22; text-align:center; }
  header { background:var(--indigo); color:#fff; padding:48px 20px 40px; }
  header img.appicon { width:96px; height:96px; border-radius:22px; box-shadow:0 4px 14px rgba(0,0,0,.35); }
  header h1 { margin:16px 0 0; font-size:1.9rem; }
  header p { color:var(--gold); font-weight:600; margin-top:8px; }
  main { max-width:560px; margin:0 auto; padding:36px 22px 8px; }
  p.lead { font-size:1.05rem; line-height:1.6; color:#3a3a44; }
  .badges { display:flex; flex-direction:column; gap:14px; align-items:center; margin:28px 0 8px; }
  a.badge { display:block; width:min(280px, 80%); background:var(--indigo); color:#fff; text-decoration:none; font-weight:700; font-size:1.05rem; padding:16px 18px; border-radius:14px; box-shadow:0 2px 8px rgba(0,0,0,.15); }
  a.badge small { display:block; font-weight:400; font-size:.78rem; color:var(--gold); margin-bottom:2px; }
  a.badge:hover { filter:brightness(1.1); }
  footer { color:#888; font-size:.85rem; padding:28px 20px 24px; }
  footer a { color:var(--indigo); }
</style>
<script>
  // Send phone visitors straight to their store — recipients of shared
  // greetings may be on either platform, so the page decides, not the sender.
  (function () {
    var ua = navigator.userAgent || "";
    var ios = /iPhone|iPad|iPod/i.test(ua);
    var android = /Android/i.test(ua);
    if (ios) {
      window.location.replace("https://apps.apple.com/us/app/orthodox-calendar-name-days/id6783400246");
    } else if (android) {
      window.location.replace("https://play.google.com/store/apps/details?id=com.twopensmedia.orthodoxcalendar");
    }
    // Desktop / unknown: stay here and show both buttons.
  })();
</script>
</head>
<body>
<header>
  <img class="appicon" src="../icon.png" alt="Orthodox Calendar app icon">
  <h1>Orthodox Calendar</h1>
  <p>Saints · Feast Days · Name Days</p>
</header>
<main>
  <p class="lead">See who the Church commemorates each day — and never miss a loved one's name day. Free, ad-free, and private.</p>
  <div class="badges">
    <a class="badge" href="https://apps.apple.com/us/app/orthodox-calendar-name-days/id6783400246"><small>Download on the</small>App Store — iPhone</a>
    <a class="badge" href="https://play.google.com/store/apps/details?id=com.twopensmedia.orthodoxcalendar"><small>Get it on</small>Google Play — Android</a>
  </div>
</main>
<footer>© 2026 Two Pens Media · <a href="../privacy-policy.html">Privacy</a> · <a href="../support.html">Support</a></footer>
</body>
</html>
